<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Translator App</title>
</head>
<body>
    <div id="translatorMainPage">
        <h1>Translator App</h1>
        <p>Welcome to the app! Please select translator type:</p>
        <div>
            <a href="#voice" class="SpeechTranslatorButton">Speech Translator</a>
            <a href="#text" class="TextTranslatorButton">Text Translator</a>
        </div>
    </div>

    <div id="voiceTranslatorContainer" style="display:none">
        <a href="#home">⬅ Back to Menu</a>
        <div class="selectContainer">
            <h1>🎤 Real-Time Voice Translator</h1>
            <div class="field">
                <label for="dataSrcLanguage">Source Language:</label>
                <select id="dataSrcLanguage" name="dataSrcLanguage">
                    <option value="pl-PL" selected>Polish</option>
                    <option value="en-US">English</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="es-ES">Spanish</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
            <div class="field">
                <label for="dataSrcLanguage">Target Language:</label>
                <select id="dataTargetLanguage" name="dataTargetLanguage">
                    <option value="pl-PL">Polish</option>
                    <option value="en-US" selected>English</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="es-ES">Spanish</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
        </div>
        <div class="buttonContainer">
            <button type="button" id="recordBtn">Record</button>
            <button type="button" id="clearBtn">Clear</button>
        </div>

        <input type="hidden" name="history" id="history" value='{{ history_json|safe }}'>
        <div class="container">
            <div id="recognition-result" class="sound-detection"></div>
            <div id="translation-result" class="sound-translation"></div>
        </div>
    </div>
    <div id="textTranslatorContainer" style="display:none">
        <a href="#home">⬅ Back to Menu</a>
        <div class="selectContainer">
            <h1>Real-Time Text Translator</h1>
            <div class="field">
                <label for="dataSrcLanguage">Source Language:</label>
                <select name="dataSrcLanguage">
                    <option value="pl-PL" selected>Polish</option>
                    <option value="en-US">English</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="es-ES">Spanish</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
            <div class="field">
                <label for="dataSrcLanguage">Target Language:</label>
                <select name="dataTargetLanguage">
                    <option value="pl-PL">Polish</option>
                    <option value="en-US" selected>English</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="es-ES">Spanish</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
                <div class="container">
                    <form id="ttsForm">
                        <label>Podaj tekst do zamiany przetłumaczenia:</label><br>
                        <textarea id="textToTranslate" name="text" rows="5" cols="50" required></textarea><br><br>
                    </form>
                    <div class="sound-translation" id="tts-target-translation"></div>
                </div>
        </div>
    </div>

    <script>
        let leftBox = document.getElementById('recognition-result');
        let rightBox = document.getElementById('translation-result');
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let recordBtn = document.getElementById('recordBtn');
        let clearBtn = document.getElementById('clearBtn');
        let translatorMainPage = document.getElementById('translatorMainPage');
        let voiceTranslatorContainer = document.getElementById('voiceTranslatorContainer');
        let textTranslatorContainer = document.getElementById('textTranslatorContainer');
        let srcLang = document.getElementById('dataSrcLanguage').value;
        let targetLang = document.getElementById('dataTargetLanguage').value;
        let textOutput = document.getElementById('tts-target-translation')

        function render () {
            hash = window.location.hash
            voiceTranslatorContainer.style.display="none";
            textTranslatorContainer.style.display="none";
            translatorMainPage.style.display="none";
            if (hash === '#voice') {
                voiceTranslatorContainer.style.display = "block";
            } else if (hash === '#text') {
                textTranslatorContainer.style.display = "block";
            } else {

                translatorMainPage.style.display = "block";
            }
        }

        function debounce(func, timeout = 500) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        window.addEventListener('hashchange', render);
        window.addEventListener('load', render);




        let audioHistory = [];
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    let formData = new FormData();
                    let historyValue = document.getElementById('history').value;
<!--                    let srcLang = document.getElementById('dataSrcLanguage').value;-->
<!--                    let targetLang = document.getElementById('dataTargetLanguage').value;-->
                    formData.append('source_lang', srcLang);
                    formData.append('target_lang', targetLang);
                    formData.append('history', historyValue);
                    formData.append('audio', audioBlob, 'audio.webm');

                    try {
                        const response = await fetch('/recognize', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();


                        if (data.success) {
                            leftBox.innerHTML += `<div class="msg-block">${data.original_text}</div>`;
                            rightBox.innerHTML += `<div class="msg-block">${data.translation}</div>`;

                            const audioFormData = new FormData();
                            audioFormData.append('text', data.translation);
                            const audioResponse = await fetch('/synthesize', {
                                method: 'POST',
                                body: audioFormData
                            });
                            if (audioResponse.ok) {

                                const audioBlob = await audioResponse.blob();
                                const audioUrl = URL.createObjectURL(audioBlob);
                                document.getElementById('history').value = data.history_json;
                                const historyArray = JSON.parse(data.history_json);
                                window.scrollTo(0, document.body.scrollHeight);
                            }
                        }
                    } catch (error) {
                        console.error("Błąd wysyłki:", error);
                    }
                };
            })


        recordBtn.addEventListener('click', async () => {
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordBtn.textContent = 'Record';
            } else {
                mediaRecorder.start();
                recordBtn.textContent = 'Stop';

            }
        });

        clearBtn.addEventListener('click', async () => {
            leftBox.innerHTML = ""
            rightBox.innerHTML = ""
            historyValue = [];
            document.getElementById('dataSrcLanguage').value = 'pl-PL';
            document.getElementById('dataTargetLanguage').value = 'en-US';

        });

        const textArea = document.getElementById('textToTranslate');


        let debounceTimer = null;
        let abortController = null;


        textArea.addEventListener('input', () => {

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {

                const text = textArea.value.trim();
                if (!text) return void (textOutput.innerHTML = "");
                abortController?.abort();
                abortController = new AbortController();

                const formData = new FormData();
                formData.append('text', text);
                formData.append('source_lang', srcLang);
                formData.append('target_lang', targetLang);


                try {
                    const translation = await fetch('/translate_tts', {
                        method: 'POST',
                        body: formData,

                    })
                    const data = await translation.json();

                    if (data.success) {
                        textOutput.innerHTML = `<div class="msg-block">${data.translation.replace(/\n/g, '<br>')}</div>`;

                        console.log(data.translation)
                    }

                } catch (e) {
                    if (e.name !== 'AbortError')
                        textOutput.innerHTML = 'Błąd połączenia';
                }

            }, 500);
        });





    </script>

</body>
</html>
